name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish Node package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Verify v tag matches package version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="$(node -p "require('./package.json').version")"
          [[ "$tag" == "v$version" && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected v$version, received $tag" >&2
            exit 1
          }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Build compatibility package and release assets
        run: |
          bun run bundle:release -- --out dist/release
          bun run scripts/prepare-release-assets.mjs
          test "$(find dist/release -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 7
          (cd dist/release && sha256sum -c SHA256SUMS)
      # D2: the legacy .tar.gz.sha256 sidecar is removed in the next version.
      - name: Publish seven release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "v$version" dist/release/* \
            --title "Forge614 Shell v$version" \
            --generate-notes
