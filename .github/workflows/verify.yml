name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  unix:
    name: Unix checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: bun install --frozen-lockfile
      - run: bun test tests/integration/release-bundle.test.ts tests/integration/windows-installer-defenses.test.ts tests/e2e/installer.e2e.test.ts
      - run: bun run typecheck
      - run: bun run build
      - run: git diff --check
      - run: bash -n install.sh

  windows:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Windows update and uninstall from the installed .cmd
        run: bun test tests/e2e/installer.windows.e2e.test.ts

  full-suite:
    name: Full suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: bun install --frozen-lockfile
      - run: bun test
